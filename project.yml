name: Protein
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "9"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0

schemes:
  Protein:
    build:
      targets:
        Protein: all
        ProteinWatch: all
        ProteinTests: [test]
    test:
      targets:
        - ProteinTests
      config: Debug
      storeKitConfiguration: Protein.storekit
    run:
      config: Debug
      storeKitConfiguration: Protein.storekit
  ProteinWatch:
    build:
      targets:
        ProteinWatch: all
    run:
      config: Debug

targets:
  Protein:
    type: application
    platform: iOS
    sources:
      - path: Protein
      - path: Shared
      - path: Protein.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.protein
        PRODUCT_NAME: Protein
        INFOPLIST_FILE: Protein/Info.plist
        CODE_SIGN_ENTITLEMENTS: Protein/Protein.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: ProteinWidget
      - target: ProteinWatch
        embed: true

  ProteinWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ProteinWidget
      - path: Shared/Models
      - path: Shared/Services/DataService.swift
      - path: Shared/Utilities/ProteinFormat.swift
      - path: Shared/Utilities/ProteinReconciliation.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.protein.widget
        INFOPLIST_FILE: ProteinWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProteinWidget/ProteinWidget.entitlements

  ProteinWatch:
    type: application
    platform: watchOS
    sources:
      - path: ProteinWatch
      - path: Shared
        excludes:
          - Services/StoreService.swift
          - Services/NotificationService.swift
          - Utilities/ConversionCopy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.protein.watch
        INFOPLIST_FILE: ProteinWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProteinWatch/ProteinWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - target: ProteinWatchWidget

  ProteinWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: ProteinWatchWidget
      - path: Shared/Models
      - path: Shared/Services/DataService.swift
      - path: Shared/Utilities/ProteinFormat.swift
      - path: Shared/Utilities/ProteinReconciliation.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.protein.watch.widget
        INFOPLIST_FILE: ProteinWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProteinWatchWidget/ProteinWatchWidget.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  ProteinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProteinTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.protein.tests
    dependencies:
      - target: Protein
